# =============================================================================
# Content dashboard configuration (Decap CMS)
#
# EDIT THESE TWO LINES BEFORE THE DASHBOARD WILL WORK:
#   1. repo:      below — replace YOUR-USERNAME/YOUR-REPO
#   2. base_url:  below — replace with your login helper address
# Full instructions are in README.md, "Turning on the dashboard".
# =============================================================================

backend:
  name: github
  repo: YOUR-USERNAME/YOUR-REPO      # e.g. alamintusher/alamintusher.github.io
  branch: main
  base_url: https://YOUR-LOGIN-HELPER.workers.dev
  auth_endpoint: auth

# If you host the site on Netlify instead, delete the block above and use this
# one instead — then login is just an email and password, with nothing to set up:
#
# backend:
#   name: git-gateway
#   branch: main

# Where uploaded photos are saved. Paths stay relative so the site works both at
# username.github.io and username.github.io/repo-name.
media_folder: uploads
public_folder: uploads

publish_mode: simple
logo_url: /assets/img/headshot.jpg

collections:
  # ---------------------------------------------------------------- profile
  - name: profile
    label: Contact details
    description: Your email, phone, location and the three short facts under the intro.
    files:
      - name: profile
        label: Contact details
        file: content/profile.json
        format: json
        fields:
          - { name: email, label: Email address, widget: string }
          - name: phone
            label: Phone number
            widget: string
            hint: Digits only, with country code — used for the tap-to-call link.
          - { name: phone_display, label: Phone number as shown, widget: string }
          - { name: location_line_1, label: Address line 1, widget: string }
          - { name: location_line_2, label: Address line 2, widget: string }
          - { name: references, label: References line, widget: string }
          - name: facts
            label: Facts under the intro
            widget: list
            field: { name: fact, label: Fact, widget: string }
            hint: Three short items work best.

  # ---------------------------------------------------------------- stories
  - name: work
    label: Selected work
    description: The story list on the homepage.
    files:
      - name: stories
        label: Story list
        file: content/stories.json
        format: json
        fields:
          - name: items
            label: Stories
            label_singular: Story
            widget: list
            summary: "{{fields.title}}"
            hint: Drag the handles to reorder. They appear on the site in this order.
            fields:
              - { name: title, label: Headline, widget: string }
              - { name: standfirst, label: Standfirst, widget: text, required: false }
              - { name: outlet, label: Outlet, widget: string, default: Netra News }
              - name: format
                label: Format
                widget: select
                default: Report
                options: [Report, Investigation, Interactive, Feature, Video, Photo essay]
              - name: date
                label: Published
                widget: datetime
                required: false
                format: YYYY-MM-DD
                date_format: YYYY-MM-DD
                time_format: false
              - name: url
                label: Link to the published story
                widget: string
                required: false
                hint: Paste the full web address. Leave empty and the story shows without a link.
              - { name: featured, label: Show on homepage, widget: boolean, default: true }

  # ---------------------------------------------------------------- photos
  - name: photography
    label: Photography
    description: The photo gallery.
    files:
      - name: photos
        label: Photo gallery
        file: content/photos.json
        format: json
        fields:
          - name: intro
            label: Intro line
            widget: text
            hint: One or two sentences at the top of the photography page.
          - name: categories
            label: Filter categories
            widget: list
            field: { name: name, label: Category, widget: string }
            hint: These become the filter buttons above the gallery.
          - name: items
            label: Photographs
            label_singular: Photograph
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: image, label: Photograph, widget: image }
              - { name: title, label: Title, widget: string }
              - name: caption
                label: Caption
                widget: text
                required: false
                hint: Also used as the description for screen readers.
              - { name: location, label: Location, widget: string, required: false }
              - { name: year, label: Year, widget: string, required: false }
              - name: category
                label: Category
                widget: string
                required: false
                hint: Must match one of the filter categories above, spelled the same way.

  # ---------------------------------------------------------------- videos
  - name: video
    label: Video
    description: The video page.
    files:
      - name: videos
        label: Video work
        file: content/videos.json
        format: json
        fields:
          - name: intro
            label: Intro line
            widget: text
          - name: items
            label: Videos
            label_singular: Video
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text, required: false }
              - { name: role, label: Your role, widget: string, required: false }
              - { name: outlet, label: Outlet, widget: string, required: false }
              - { name: year, label: Year, widget: string, required: false }
              - name: youtube_id
                label: YouTube video ID
                widget: string
                required: false
                hint: >
                  Just the ID, not the whole address. In
                  youtube.com/watch?v=dQw4w9WgXcQ the ID is dQw4w9WgXcQ.
                  Fill this in and the thumbnail appears automatically.
              - { name: url, label: Link out (optional), widget: string, required: false }
              - name: thumbnail
                label: Fallback thumbnail
                widget: image
                required: false
                hint: Only needed if there is no YouTube ID.
