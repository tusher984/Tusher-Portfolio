# Publishes the repository to GitHub Pages exactly as it stands.
#
# The site is plain HTML, CSS and JavaScript: there is nothing to compile, so
# this workflow uploads the folder and deploys it — no build step to break.
# Deploying through the Pages artifact means Jekyll never runs, and
# include-hidden-files keeps .nojekyll in the upload so the site behaves the
# same way if it is ever served straight from the branch again.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already publishing.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
