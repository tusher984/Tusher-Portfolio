backend:
  name: github
  repo: tusher984/Tusher-Portfolio
  branch: main

media_folder: "assets/img"
public_folder: "/assets/img"

collections:
  - name: "website_sections"
    label: "All Website Content & Pages"
    files:
      - file: "content/site.json"
        label: "1. Homepage Titles & Texts"
        name: "site"
        fields:
          - label: "Hero Intro"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Eyebrow Text", name: "eyebrow", widget: "string"}
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Tagline", name: "tagline", widget: "string"}
              - {label: "Lead Paragraph", name: "lead", widget: "text"}
              - {label: "Primary Button Text", name: "cta_primary", widget: "string", required: false}
              - {label: "Secondary Button Text", name: "cta_secondary", widget: "string", required: false}

      - file: "content/about.json"
        label: "2. About & What I Cover"
        name: "about"
        fields:
          - {label: "Section Eyebrow", name: "eyebrow", widget: "string"}
          - {label: "Heading", name: "heading", widget: "string"}
          - {label: "Beats Eyebrow", name: "beats_eyebrow", widget: "string"}
          - label: "What I Cover (Beats)"
            name: "beats"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description Text", name: "text", widget: "text"}
          - {label: "Bio Paragraphs", name: "paragraphs", widget: "list"}

      - file: "content/stories.json"
        label: "3. Selected Works (Stories)"
        name: "stories"
        fields:
          - label: "Story Items"
            name: "items"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Standfirst / Description", name: "standfirst", widget: "text"}
              - {label: "Outlet Name", name: "outlet", widget: "string"}
              - {label: "Format (e.g. Report, Interactive)", name: "format", widget: "string"}
              - {label: "Publish Date", name: "date", widget: "date", required: false}
              - {label: "URL Link", name: "url", widget: "string", required: false}

      - file: "content/photos.json"
        label: "4. Photography Section"
        name: "photos"
        fields:
          - {label: "Intro Text", name: "intro", widget: "text"}
          - label: "Photo Items"
            name: "items"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Caption", name: "caption", widget: "text"}
              - {label: "Location", name: "location", widget: "string"}
              - {label: "Year", name: "year", widget: "string"}
              - {label: "Category", name: "category", widget: "string"}
              - {label: "Image Upload", name: "image", widget: "image"}

      - file: "content/videos.json"
        label: "5. Videos Section"
        name: "videos"
        fields:
          - {label: "Section Intro", name: "intro", widget: "text"}
          - label: "Video Items"
            name: "items"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "YouTube ID / Link", name: "youtube_id", widget: "string", required: false}
              - {label: "Upload Video File (Optional)", name: "url", widget: "file", required: false}
              - {label: "Upload Custom Thumbnail", name: "thumbnail", widget: "image", required: false}
              - {label: "Year", name: "year", widget: "string"}

      - file: "content/experience.json"
        label: "6. Work Experience Timeline"
        name: "experience"
        fields:
          - label: "Job Entries"
            name: "items"
            widget: "list"
            fields:
              - {label: "Role / Position", name: "role", widget: "string"}
              - {label: "Organization Name", name: "org", widget: "string"}
              - {label: "Period (e.g. Dec 2025 — Present)", name: "period", widget: "string"}
              - {label: "Currently Working Here", name: "current", widget: "boolean", default: false}
              - {label: "Responsibilities / Bullets", name: "bullets", widget: "list", required: false}

      - file: "content/skills.json"
        label: "7. Skills & Tools"
        name: "skills"
        fields:
          - label: "Skill Groups"
            name: "groups"
            widget: "list"
            fields:
              - {label: "Group Title", name: "title", widget: "string"}
              - {label: "Skills List", name: "items", widget: "list"}

      - file: "content/credentials.json"
        label: "8. Education & Fellowships"
        name: "credentials"
        fields:
          - {label: "Education Label", name: "education_label", widget: "string"}
          - label: "Education Items"
            name: "education"
            widget: "list"
            fields:
              - {label: "Institution", name: "title", widget: "string"}
              - {label: "Meta Details", name: "meta", widget: "string"}
              - {label: "Result", name: "result", widget: "string", required: false}
          - {label: "Training Label", name: "training_label", widget: "string"}
          - label: "Training & Fellowships"
            name: "training"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Meta Details", name: "meta", widget: "string"}

      - file: "content/profile.json"
        label: "9. Contact, Socials & Location"
        name: "profile"
        fields:
          - {label: "Email Address", name: "email", widget: "string"}
          - {label: "Phone Display Number", name: "phone_display", widget: "string"}
          - {label: "Address Line 1 (Optional - Leave empty to hide)", name: "location_line_1", widget: "string", required: false}
          - {label: "Address Line 2 (City, Country)", name: "location_line_2", widget: "string", required: false}
          - {label: "References Text (Leave empty to hide)", name: "references", widget: "string", required: false}
          - {label: "Quick Facts", name: "facts", widget: "list", required: false}
          - {label: "LinkedIn URL", name: "linkedin", widget: "string", required: false}
          - {label: "X (Twitter) URL", name: "twitter", widget: "string", required: false}
          - {label: "Instagram URL", name: "instagram", widget: "string", required: false}
          - {label: "Facebook URL", name: "facebook", widget: "string", required: false}