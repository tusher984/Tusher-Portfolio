        <line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/>

    </nav>
  </div>
</header>

<main id="main">

  <section class="page-hero wrap">
    <p class="eyebrow" data-seq>Photography</p>
    <h1 data-seq>Documentary photography</h1>
    <p class="lead" id="gallery-intro" data-seq>
      Documentary photography from assignments and personal work across Bangladesh.
    </p>
  </section>

  <section class="section section--tight" style="padding-top:0">
    <div class="wrap">
      <!-- Filter buttons are generated from the categories in content/photos.json -->
      <div class="filters" id="filters" role="group" aria-label="Filter photographs by category"></div>
      <!-- Photographs are generated from content/photos.json -->
      <div class="masonry" id="masonry" aria-live="polite"></div>
    </div>
  </section>

</main>

<!-- Full-screen photo viewer -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photograph viewer" aria-hidden="true">
  <button class="lb-btn lb-close" type="button" aria-label="Close viewer">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
    </svg>
  </button>
  <button class="lb-btn lb-prev" type="button" aria-label="Previous photograph">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="14 6 8 12 14 18"/>
    </svg>
  </button>
  <button class="lb-btn lb-next" type="button" aria-label="Next photograph">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="10 6 16 12 10 18"/>
    </svg>
  </button>
  <figure>
    <!-- No src until a photograph is opened: an empty one would make the
         browser request this page again as if it were an image. -->
    <img class="lb-img" alt="">
    <figcaption>
      <span class="lb-title"></span>
      <span class="lb-meta"></span>
    </figcaption>
  </figure>
  <span class="lb-count"></span>
</div>

<footer class="site-footer">
